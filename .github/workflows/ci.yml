name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, matches Totipo Java
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build and verify Android app
        run: |
          nix develop path:.#ci --command bash -euc '
            ./bootstrap-m0.sh
            python3 tools/verify-apk.py app/build/outputs/apk/debug/app-debug.apk --debug-probe
            python3 tools/verify-apk.py app/build/outputs/apk/release/app-release-unsigned.apk --unsigned --no-debug-probe
          '
      - name: Require reproducibility inputs to remain unchanged
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

  qualification:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, matches Totipo Java
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Validate Nix package
        run: |
          nix flake check path:.
          nix build path:.
      - name: Require reproducibility inputs to remain unchanged
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
